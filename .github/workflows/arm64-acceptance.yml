name: Windows ARM64 acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/arm64-acceptance.yml
      - scripts/test-windows-arm64-preview.ps1
      - scripts/build-windows-arm64-preview.ps1
      - scripts/installer.ps1
      - build/windows/**
      - build/portable/Update-WebDAVMount.ps1

permissions:
  contents: read

jobs:
  acceptance:
    name: Native ARM64 preview acceptance
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native dependencies, mount, upgrade and uninstall
        shell: pwsh
        run: |
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'wdm-arm64-source.zip'
          $source = Join-Path $env:RUNNER_TEMP 'wdm-arm64-source'
          git archive --format=zip -o $sourceArchive HEAD -- scripts/test-windows-arm64-preview.ps1 scripts/build-windows-arm64-preview.ps1 scripts/installer.ps1 build/windows build/portable
          if ($LASTEXITCODE -ne 0) { throw 'Cannot export installer build inputs.' }
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $source
          & (Join-Path $source 'scripts/test-windows-arm64-preview.ps1') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wdm-arm64-evidence')
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-acceptance
          path: |
            ${{ runner.temp }}/wdm-arm64-evidence/*.json
            ${{ runner.temp }}/wdm-arm64-evidence/*.log
