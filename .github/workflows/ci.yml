name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Go version and cache paths
        id: go
        run: |
          $source = Get-Content -Raw -LiteralPath go.mod
          if ($source -notmatch '(?m)^go (\d+\.\d+\.\d+)\s*$') {
            throw 'Missing Go version in go.mod'
          }
          "range=~$($Matches[1])" >> $env:GITHUB_OUTPUT
          "GOMODCACHE=$(Join-Path $env:RUNNER_TEMP 'wdm-go-modules')" >> $env:GITHUB_ENV
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'wdm-go-build')" >> $env:GITHUB_ENV
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        id: go-toolchain
        with:
          go-version: '${{ steps.go.outputs.range }}'
          check-latest: false
          cache: false
      - name: Cache Go modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Go build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - run: npm run check
        env:
          npm_config_prefer_offline: 'true'

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-linux.py
      - name: Prepare Debian archive cache
        id: apt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/debian-bookworm-archives"
          printf 'week=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/debian-bookworm-archives/*.deb
          key: debian-bookworm-archives-${{ runner.arch }}-${{ hashFiles('scripts/ci-debian-smoke.sh') }}-${{ steps.apt.outputs.week }}
          restore-keys: debian-bookworm-archives-${{ runner.arch }}-${{ hashFiles('scripts/ci-debian-smoke.sh') }}-
      - name: Verify the Debian GTK package
        env:
          TRUSTED_FUSE: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker_args=()
          smoke_args=()
          if [[ "$TRUSTED_FUSE" == true && "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            test -c /dev/fuse
            docker_args=(--device /dev/fuse --cap-add SYS_ADMIN)
            smoke_args=(--fuse)
          fi
          docker run --rm "${docker_args[@]}" \
            -v "${RUNNER_TEMP}/debian-bookworm-archives:/var/cache/apt/archives" \
            -v "${GITHUB_WORKSPACE}:/source:ro" debian:bookworm-slim bash /source/scripts/ci-debian-smoke.sh "${smoke_args[@]}"

  contribution:
    name: Contribution checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify README and Chinese PR content
        run: node scripts/check-contribution.mjs
