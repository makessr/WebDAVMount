name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Go version and cache paths
        id: go
        run: |
          $source = Get-Content -Raw -LiteralPath go.mod
          if ($source -notmatch '(?m)^go (\d+\.\d+\.\d+)\s*$') {
            throw 'Missing Go version in go.mod'
          }
          "range=~$($Matches[1])" >> $env:GITHUB_OUTPUT
          "GOMODCACHE=$(Join-Path $env:RUNNER_TEMP 'wdm-go-modules')" >> $env:GITHUB_ENV
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'wdm-go-build')" >> $env:GITHUB_ENV
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        id: go-toolchain
        with:
          go-version: '${{ steps.go.outputs.range }}'
          check-latest: false
          cache: false
      - name: Cache Go modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Go build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - run: npm run check
        env:
          npm_config_prefer_offline: 'true'

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-linux.py
      - name: Prepare Debian archive cache
        id: apt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/debian-bookworm-archives"
          printf 'week=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/debian-bookworm-archives/*.deb
          key: debian-bookworm-archives-${{ runner.arch }}-${{ hashFiles('scripts/ci-debian-smoke.sh') }}-${{ steps.apt.outputs.week }}
          restore-keys: debian-bookworm-archives-${{ runner.arch }}-${{ hashFiles('scripts/ci-debian-smoke.sh') }}-
      - name: Verify the Debian GTK package
        run: |
          docker run --rm \
            -v "${RUNNER_TEMP}/debian-bookworm-archives:/var/cache/apt/archives" \
            -v "${GITHUB_WORKSPACE}:/source:ro" debian:bookworm-slim bash /source/scripts/ci-debian-smoke.sh

  linux-fuse:
    name: Linux FUSE checks (${{ matrix.arch }})
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the current package and FUSE test dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -c /dev/fuse
          test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
          python3 linux/package.py --output "$RUNNER_TEMP/mountbridge-fuse"
          test "$(dpkg-deb -f "$RUNNER_TEMP/mountbridge-fuse/"*.deb Architecture)" = all
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/mountbridge-fuse/"*.deb \
            xfce4-terminal dbus-x11 xvfb xauth thunar desktop-file-utils
          test "$(dpkg-query -W -f='${Architecture}' rclone)" = "$EXPECTED_ARCH"
          rclone version
      - name: Mount WebDAV and SFTP as a regular user
        shell: bash
        run: dbus-run-session -- xvfb-run -a env NO_AT_BRIDGE=1 /usr/bin/python3 linux/smoke_test.py

  contribution:
    name: Contribution checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify README and Chinese PR content
        run: node scripts/check-contribution.mjs
